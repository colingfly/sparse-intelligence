[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparse-intelligence"
version = "0.1.0"
description = "Python SDK for the Sparse Intelligence agentic AI platform"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
